name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keeps uv from creating a venv per job and makes cache keys stable.
  UV_FROZEN: "1"

jobs:
  quality:
    name: lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: ruff check
        run: uv run python -m ruff check .

      - name: ruff format --check
        run: uv run python -m ruff format --check .

      - name: mypy --strict
        run: uv run python -m mypy .

  test:
    name: unit tests (no infrastructure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: pytest
        run: |
          uv run python -m pytest \
            -m "not integration" \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
