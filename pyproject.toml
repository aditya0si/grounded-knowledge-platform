[project]
name = "grounded-knowledge-platform"
version = "0.1.0"
description = "Enterprise-grade RAG: ACL-enforced hybrid retrieval with measured, CI-gated quality."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aditya Singh" }]
keywords = ["rag", "retrieval-augmented-generation", "pgvector", "hybrid-search", "abac", "multi-tenant"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "arq>=0.26",
    "structlog>=24.4",
    "fastembed>=0.4",
    "numpy>=2.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "numpy>=2.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gkp"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F",      # pycodestyle / pyflakes
    "I",                # isort
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # bugbear
    "A",                # builtins shadowing
    "C4",               # comprehensions
    "DTZ",              # naive datetimes
    "SIM",              # simplify
    "RET",              # return consistency
    "PTH",              # pathlib
    "RUF",              # ruff-specific
    "S",                # bandit security rules
    "BLE",              # blind except — broad catches must be explicitly justified
    "PLW0603",          # global statement — the engine/client singletons are deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]     # asserts and fixture credentials

[tool.ruff.lint.isort]
known-first-party = ["gkp"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
pretty = true
show_error_codes = true
# The pydantic plugin is required for Settings(...) and every other BaseModel
# subclass to type-check meaningfully; without it mypy validates against a
# generated signature that omits pydantic-settings' own init parameters.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "pgvector.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: requires a live Postgres and Redis (deselected by default in CI lint job)",
]
filterwarnings = ["error::DeprecationWarning:gkp.*"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src/gkp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
